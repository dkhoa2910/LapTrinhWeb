<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị – TheSecond Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

    <!-- HEADER DÙNG CHUNG -->
    <header class="main-header">
        <div class="header-inner">
            <a href="../api/admin/dashboard.php" class="logo-brand">
                <div class="logo-icon"><i data-lucide="shield"></i></div>
                <div class="logo-title">TheSecond Admin</div>
            </a>
            <div class="user-controls">
                <a href="../user/index.html" class="nav-link">
                    <i data-lucide="arrow-left"></i> Về trang bán hàng
                </a>
            </div>
        </div>
    </header>

    <!-- KHUNG ĐĂNG NHẬP QUẢN TRỊ -->
    <main class="auth-page-wrapper">
        <div class="auth-box">

            <div id="login-error" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; font-size:13px; font-weight:600; padding:12px 16px; border-radius:10px; margin-bottom:20px; text-align:center;">
                Sai tài khoản hoặc mật khẩu quản trị. Vui lòng thử lại.
            </div>

            <div class="auth-icon-wrap"><i data-lucide="shield-check"></i></div>
            <h1 class="auth-title">Đăng Nhập Quản Trị</h1>
            <p class="auth-sub">Khu vực dành riêng cho quản trị viên hệ thống TheSecond</p>
            <form id="admin-login-form" method="POST" action="../api/admin/main/loginad.php" class="auth-form">
                <div style="margin-bottom: 20px;">
                    <label class="form-label">Email quản trị</label>
                    <input type="email" name="email" id="admin-username" class="form-control" 
                        placeholder="admin@dientucu.vn" required>
                </div>

                <div style="margin-bottom: 12px;">
                    <label class="form-label">Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" name="mat_khau" id="admin-password" class="form-control" placeholder="Nhập mật khẩu quản trị" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('admin-password')">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:8px; margin-bottom: 24px;">
                    <input type="checkbox" id="remember-admin" style="width:16px; height:16px;">
                    <label for="remember-admin" style="font-size:13px; color:#64748b; font-weight:500;">Ghi nhớ đăng nhập trên thiết bị này</label>
                </div>

                <button type="submit" class="btn">
                    <i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Đăng Nhập Hệ Thống
                </button>

                <p style="text-align:center; font-size:12px; color:#94a3b8; margin-top:20px; line-height:1.6;">
                    Tài khoản demo: <strong style="color:#475569;">admin</strong> / mật khẩu: <strong style="color:#475569;">admin123</strong>
                </p>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div style="max-width: 1280px; margin: 0 auto;">
            <h2>THESECOND ADMIN</h2>
            <p>Hệ thống quản trị nội bộ – TheSecond. Đồ án môn Lập trình Web.</p>
        </div>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
